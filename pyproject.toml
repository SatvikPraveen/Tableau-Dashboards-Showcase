[project]
name = "tableau-dashboards-showcase-tools"
version = "1.1.0"
description = "Reproducibility and audit tooling for the Tableau Dashboards Showcase"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["0*_*/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9

[tool.ruff.lint.isort]
known-first-party = ["tools"]
